<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SquatGym - Seleccionar Medio de Pago</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#4ae183",
                      "tertiary-fixed-dim": "#c6c6c7",
                      "surface-container-lowest": "#ffffff",
                      "secondary-container": "#e2dfde",
                      "on-surface": "#1c1b1b",
                      "on-secondary-fixed-variant": "#474746",
                      "on-tertiary-fixed-variant": "#454747",
                      "on-primary-fixed": "#00210c",
                      "outline": "#6c7b6d",
                      "on-secondary-fixed": "#1c1b1b",
                      "on-secondary-container": "#636262",
                      "tertiary": "#5d5f5f",
                      "secondary-fixed": "#e5e2e1",
                      "on-primary-fixed-variant": "#005228",
                      "on-error-container": "#93000a",
                      "tertiary-container": "#b2b3b3",
                      "surface-container-low": "#f6f3f2",
                      "tertiary-fixed": "#e2e2e2",
                      "surface-bright": "#fcf9f8",
                      "error-container": "#ffdad6",
                      "background": "#fcf9f8",
                      "surface-container-highest": "#e5e2e1",
                      "on-tertiary-fixed": "#1a1c1c",
                      "on-error": "#ffffff",
                      "inverse-surface": "#313030",
                      "on-tertiary-container": "#434546",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#005027",
                      "primary": "#006d37",
                      "inverse-on-surface": "#f3f0ef",
                      "surface": "#fcf9f8",
                      "surface-container-high": "#eae7e7",
                      "on-surface-variant": "#3d4a3e",
                      "on-background": "#1c1b1b",
                      "primary-fixed": "#6bfe9c",
                      "surface-variant": "#e5e2e1",
                      "on-primary": "#ffffff",
                      "surface-dim": "#dcd9d9",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#4ae183",
                      "outline-variant": "#bbcbbb",
                      "secondary": "#5f5e5e",
                      "surface-tint": "#006d37",
                      "surface-container": "#f0eded",
                      "primary-container": "#2ecc71",
                      "error": "#ba1a1a",
                      "secondary-fixed-dim": "#c8c6c5"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "display": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-background text-on-surface font-body antialiased">
<!-- Main Canvas -->
<main class="flex-1 flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full h-16 flex items-center sticky top-0 z-50 bg-[#FCF9F8] dark:bg-[#1C1B1B] px-8 justify-between border-b border-outline-variant/10">
<div class="flex items-center gap-4">
<a class="text-2xl font-black text-[#006D37] dark:text-[#2ECC71] uppercase italic font-['Manrope'] tracking-tight" href="../../home.html">SquatGym</a>
</div>
<div class="hidden md:flex items-center gap-8 font-['Manrope'] font-bold tracking-tight"><a class="text-[#3D4A3E] dark:text-[#EAE7E7] hover:text-[#006D37] transition-colors duration-200 cursor-pointer" href="../kiosco.html">TIENDA</a>
<a class="text-[#3D4A3E] dark:text-[#EAE7E7] hover:text-[#006D37] transition-colors duration-200 cursor-pointer" href="../kiosco.html#carrito">CARRITO</a>
<a class="text-[#006D37] dark:text-[#2ECC71] border-b-2 border-[#006D37] cursor-pointer" href="../kiosco.html#historial">HISTORIAL</a></div>
<div class="flex items-center gap-4 text-[#5F5E5E]">
<span class="material-symbols-outlined cursor-pointer active:opacity-70" data-icon="notifications">notifications</span>
<div class="h-8 w-8 rounded-full bg-surface-container-high flex items-center justify-center cursor-pointer active:opacity-70">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<!-- Content Canvas -->
<div class="p-8 md:p-12 max-w-6xl mx-auto w-full flex-1 flex flex-col justify-center">
<!-- Header Section -->
<div class="mb-12 text-center">
<h1 class="text-4xl md:text-5xl font-black text-on-surface mb-4 tracking-tight uppercase">Seleccionar Medio de Pago</h1>
<p class="text-on-surface-variant max-w-lg mx-auto">Elija el método preferido por el cliente para completar la transacción de forma segura.</p>
</div>
<!-- Bento-style Payment Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
<!-- TRANSFERENCIA -->
<button class="group relative flex flex-col items-center justify-center p-10 bg-surface-container-lowest rounded-full transition-all duration-300 hover:bg-primary-container/10 border-2 border-transparent hover:border-primary-container" onclick="window.location.href='transferencia.html'">
<div class="w-20 h-20 rounded-2xl bg-primary-fixed mb-6 flex items-center justify-center text-primary transition-transform group-hover:scale-110">
<span class="material-symbols-outlined text-4xl" data-icon="account_balance">account_balance</span>
</div>
<span class="text-xl font-bold text-on-surface mb-2 font-headline">TRANSFERENCIA</span>
<span class="text-sm text-on-surface-variant text-center leading-relaxed">Depósito bancario o transferencia inmediata</span>
<div class="absolute top-4 right-8 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_forward</span>
</div>
</button>
<!-- QR -->
<button class="group relative flex flex-col items-center justify-center p-10 bg-surface-container-lowest rounded-full transition-all duration-300 hover:bg-primary-container/10 border-2 border-transparent hover:border-primary-container" onclick="window.location.href='qr.html'">
<div class="w-20 h-20 rounded-2xl bg-primary-fixed mb-6 flex items-center justify-center text-primary transition-transform group-hover:scale-110">
<span class="material-symbols-outlined text-4xl" data-icon="qr_code_2">qr_code_2</span>
</div>
<span class="text-xl font-bold text-on-surface mb-2 font-headline">QR</span>
<span class="text-sm text-on-surface-variant text-center leading-relaxed">Escaneo rápido desde cualquier billetera virtual</span>
<div class="absolute top-4 right-8 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_forward</span>
</div>
</button>
<!-- TARJETA -->
<button class="group relative flex flex-col items-center justify-center p-10 bg-surface-container-lowest rounded-full transition-all duration-300 hover:bg-primary-container/10 border-2 border-transparent hover:border-primary-container" onclick="window.location.href='tarjeta.html'">
<div class="w-20 h-20 rounded-2xl bg-primary-fixed mb-6 flex items-center justify-center text-primary transition-transform group-hover:scale-110">
<span class="material-symbols-outlined text-4xl" data-icon="credit_card">credit_card</span>
</div>
<span class="text-xl font-bold text-on-surface mb-2 font-headline">TARJETA</span>
<span class="text-sm text-on-surface-variant text-center leading-relaxed">Crédito o Débito vía terminal bancaria</span>
<div class="absolute top-4 right-8 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_forward</span>
</div>
</button>
</div>
<!-- Discrete Footer Actions -->
<div class="flex flex-col items-center gap-8">
<div class="flex items-center gap-2 text-on-surface-variant bg-surface-container-low px-6 py-3 rounded-full border border-outline-variant/10">
<span class="material-symbols-outlined text-lg" data-icon="security">security</span>
<span class="text-sm font-medium">Transacción cifrada y gestionada por SquatGym Central</span>
</div>
<button class="group flex items-center gap-2 text-secondary hover:text-primary font-semibold transition-colors" onclick="window.location.href='../kiosco.html#carrito'">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span>Volver al Carrito</span>
</button>
</div>
</div>
<!-- Tonal depth background element -->
<div class="fixed bottom-0 right-0 w-1/3 h-1/3 bg-primary-container/5 rounded-tl-[200px] -z-10 blur-3xl"></div>
<div class="fixed top-20 left-10 w-64 h-64 bg-primary-fixed/10 rounded-full -z-10 blur-[100px]"></div>
</main>
</body></html>
