<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SquatGym - Agregar Producto</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#006d37",
                        "secondary": "#5f5e5e",
                        "background": "#fcf9f8",
                        "on-surface": "#1c1b1b",
                        "surface-container-low": "#f6f3f2",
                        "surface-container-highest": "#e5e2e1",
                        "on-secondary-container": "#636262",
                        "primary": "#006d37",
                        "primary-container": "#2ecc71",
                        "on-primary": "#ffffff",
                        "surface": "#fcf9f8",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#3d4a3e",
                        "outline-variant": "#bbcbbb",
                        "secondary-container": "#e2dfde",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(252, 249, 248, 0.7);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="min-h-screen bg-background text-on-surface font-body antialiased">
<!-- Top Bar Navigation (Based on TopAppBar JSON but simplified for focused task) -->
<header class="flex justify-between items-center w-full px-8 py-6 max-w-full bg-surface">
<a class="text-2xl font-black text-primary tracking-tighter font-headline" href="../home.html" style="">
            SquatGym
        </a>
<div class="flex items-center gap-4">
<button class="text-secondary hover:text-primary transition-colors p-2" style="">
<span class="material-symbols-outlined" data-icon="settings" style="">settings</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high">
<img alt="Avatar de administrador" class="w-full h-full object-cover" data-alt="Close up professional portrait of a fitness manager with short hair in a modern gym environment" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBV6ysy4kBKcBfwasY4qeoCYiTWR_vD5EARHsSRgdbgsDyM_Sa2G_WVur9INQPNwNVHNfX2YZEwJ3jp0LuF-qUsGJUz8x3S36gw8uB1-1RfGUwox1RRO6YIuWULnCqi7jXzFZ9JorLuy_ypHvv0GVuw7P1M_LuGkMm3tvE3iaUPPQZVX0A69j69OpJ921s9IjLz5_LPsHiaMU98PI-7S37Te6UB4bFIcKdWvF15oGsadUIYtQo72we2xA0LrjZ-UJhrYa8WwE4M_A" style="">
</div>
</div>
</header>
<main class="w-full max-w-4xl px-6 py-12 flex flex-col gap-8">
<!-- Editorial Header Section -->
<div class="flex flex-col gap-2">
<h1 class="font-headline font-extrabold text-4xl tracking-tight text-on-surface" style="">AGREGAR PRODUCTO</h1>
<p class="text-on-surface-variant font-medium" style="">Ingrese la información del producto para agregar al catálogo.</p>
</div>
<!-- Main Form Canvas -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-8">
<!-- Left Column: Visual Assets -->
<div class="md:col-span-5 flex flex-col gap-6">
<div class="bg-surface-container-low rounded-full p-8 aspect-square flex flex-col items-center justify-center text-center border-2 border-dashed border-outline-variant hover:border-primary-container transition-all cursor-pointer group">
<span class="material-symbols-outlined text-5xl text-secondary group-hover:text-primary-container mb-4" data-icon="add_a_photo" style="">add_a_photo</span>
<span class="font-headline font-bold text-lg text-on-surface" style="">Foto del Producto</span>
<p class="text-xs text-on-surface-variant mt-2 px-4 italic" style="">Arrastra una imagen o haz clic para subir</p>
</div>
<div class="bg-primary-container/10 p-6 rounded-xl border-l-4 border-primary-container">
<h3 class="font-headline font-bold text-on-primary-container mb-2" style="">Consejo Pro</h3>
<p class="text-sm text-on-surface-variant leading-relaxed" style="">Las fotos con fondo blanco o neutro mejoran la visualización en el kiosco táctil.</p>
</div>
</div>
<!-- Right Column: Product Data -->
<div class="md:col-span-7">
<form class="flex flex-col gap-6 bg-surface-container-lowest p-8 rounded-full shadow-[0_12px_32px_rgba(28,27,27,0.06)]" action="inventario.html">
<!-- Product Name -->
<div class="flex flex-col gap-2">
<label class="font-headline font-bold text-sm tracking-wide uppercase text-secondary" style="">Nombre del Producto</label>
<input class="bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-secondary/50" placeholder="Ej. Proteína Whey 1kg" type="text">
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<!-- Category Selector -->
<div class="flex flex-col gap-2">
<label class="font-headline font-bold text-sm tracking-wide uppercase text-secondary" style="">Categoría</label>
<select class="bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface appearance-none">
<option>BEBIDAS</option>
<option>COMESTIBLES</option>
<option>INDUMENTARIA</option>
<option>ACCESORIOS</option>
<option>EQUIPO</option>
</select>
</div>
<!-- Price -->
<div class="flex flex-col gap-2">
<label class="font-headline font-bold text-sm tracking-wide uppercase text-secondary" style="">Precio</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-primary" style="">$</span>
<input class="w-full bg-surface-container-highest border-none rounded-xl pl-8 pr-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface" placeholder="0.00" type="number">
</div>
</div>
</div>
<!-- Quantity -->
<div class="flex flex-col gap-2">
<label class="font-headline font-bold text-sm tracking-wide uppercase text-secondary" style="">Cantidad</label>
<input class="bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface" placeholder="0" type="number">
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="font-headline font-bold text-sm tracking-wide uppercase text-secondary" style="">Descripción</label>
<textarea class="bg-surface-container-highest border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface resize-none" placeholder="Detalles técnicos, ingredientes o especificaciones..." rows="4"></textarea>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 mt-4">
<button class="flex-1 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition-all active:scale-[0.98]" type="submit" style="">
                            ACEPTAR
                        </button>
<button class="flex-1 border-2 border-secondary-container text-secondary font-headline font-bold py-4 rounded-xl hover:bg-secondary-container transition-all active:scale-[0.98]" type="button" onclick="window.location.href='inventario.html'" style="">
                            CANCELAR
                        </button>
</div>
</form>
</div>
</div>
<!-- Inventory Heatmap Preview (Decorative Element for Kinetic Curator North Star) -->
</main>
<!-- Footer Space -->
</body></html>
