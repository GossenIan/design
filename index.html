<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SquatGym - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006d37",
                        "primary-container": "#2ecc71",
                        "on-primary": "#ffffff",
                        "surface": "#fcf9f8",
                        "on-surface": "#1c1b1b",
                        "on-surface-variant": "#3d4a3e",
                        "outline": "#6c7b6d",
                        "surface-container-highest": "#e5e2e1",
                        "surface-container-lowest": "#ffffff",
                    },
                    "borderRadius": { "xl": "0.5rem" },
                    "fontFamily": { "headline": ["Manrope"], "body": ["Inter"] }
                },
            },
        }
    </script>

    <style>
        .input-error {
            border-bottom-color: #dc2626 !important;
            background-color: #fef2f2 !important;
        }

        .input-error:focus {
            border-bottom-color: #dc2626 !important;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">

<div class="relative min-h-screen w-full flex items-center justify-center p-6">
    <div class="absolute inset-0 z-0">
        <img class="w-full h-full object-cover filter blur-sm scale-105" src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop" alt="Fondo de gimnasio"/>
        <div class="absolute inset-0 bg-on-surface/10"></div>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <div class="bg-surface-container-lowest rounded-xl p-10 md:p-12 shadow-2xl">
            <div class="flex flex-col items-center mb-8">
                <div class="w-32 h-32 mb-6 overflow-hidden rounded-full flex items-center justify-center bg-white shadow-sm border border-gray-100">
                    <img class="w-full h-full object-contain p-2" alt="Logo SquatGym" src="img/logo.png" onerror="this.src='https://ui-avatars.com/api/?name=Squat+Gym&background=006d37&color=fff'"/>
                </div>
                <h1 class="font-headline font-extrabold text-2xl tracking-tight text-on-surface text-center">Bienvenido a SquatGym</h1>
            </div>

            <form class="space-y-6" id="loginForm" novalidate>
                <div>
                    <label class="block font-label text-sm font-semibold text-on-surface-variant mb-2" for="username">Usuario</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
                        <input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-0 border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all"
                               id="username"
                               placeholder="nombre.apellido"
                               type="text"
                               autocomplete="username"
                               aria-describedby="usernameError"/>
                    </div>
                    <p id="usernameError" class="text-xs text-red-600 mt-2 hidden" role="alert">
                        Debe ingresar un usuario.
                    </p>
                </div>

                <div>
                    <label class="block font-label text-sm font-semibold text-on-surface-variant mb-2" for="password">Contraseña</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
                        <input class="w-full pl-12 pr-12 py-4 bg-surface-container-highest border-0 border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all"
                               id="password"
                               placeholder="••••••••"
                               type="password"
                               autocomplete="current-password"
                               aria-describedby="passwordError"/>
                        <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
                            <span class="material-symbols-outlined" id="eyeIcon">visibility</span>
                        </button>
                    </div>
                    <p id="passwordError" class="text-xs text-red-600 mt-2 hidden" role="alert">
                        Debe ingresar una contraseña.
                    </p>
                </div>

                <div class="pt-4">
                    <button class="w-full py-4 px-6 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-xl shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        <span>Iniciar Sesión</span>
                        <span class="material-symbols-outlined">login</span>
                    </button>
                </div>

                <p id="errorMessage" class="text-xs text-red-600 text-center hidden mt-2" role="alert">
                    Usuario o contraseña incorrectos.
                </p>
            </form>

            <div class="mt-10 pt-8 border-t border-gray-200 text-center text-sm text-gray-500">
                <p>El sistema identificará su rol: <span class="font-semibold text-on-surface">Administrador, Encargado o Secretaria</span>.</p>
            </div>
        </div>
        <div class="mt-8 text-center text-xs text-gray-400">
            © 2026 SquatGym Management Portal. Todos los derechos reservados.
        </div>
    </div>
</div>

<script>
    // LISTA DE USUARIOS - luego podés reemplazarla por una base de datos real
    const usersDB = [
        { user: "admin", pass: "1234", role: "Administrador" },
        { user: "juan.perez", pass: "gym2026", role: "Encargado Sucursal" },
        { user: "ana.secretaria", pass: "pass987", role: "Secretaria" }
    ];

    const loginForm = document.getElementById('loginForm');

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const errorMessage = document.getElementById('errorMessage');

    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    function mostrarError(input, mensaje) {
        input.classList.add('input-error');
        input.setAttribute('aria-invalid', 'true');
        mensaje.classList.remove('hidden');
    }

    function limpiarError(input, mensaje) {
        input.classList.remove('input-error');
        input.setAttribute('aria-invalid', 'false');
        mensaje.classList.add('hidden');
    }

    function limpiarErrores() {
        limpiarError(usernameInput, usernameError);
        limpiarError(passwordInput, passwordError);
        errorMessage.classList.add('hidden');
    }

    // Mostrar / ocultar contraseña
    togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    // Limpia los errores cuando el usuario empieza a escribir
    usernameInput.addEventListener('input', () => {
        limpiarError(usernameInput, usernameError);
        errorMessage.classList.add('hidden');
    });

    passwordInput.addEventListener('input', () => {
        limpiarError(passwordInput, passwordError);
        errorMessage.classList.add('hidden');
    });

    // Validación del login
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();

        limpiarErrores();

        const userInput = usernameInput.value.trim().toLowerCase();
        const passInput = passwordInput.value.trim();

        let hayError = false;

        if (userInput === '') {
            mostrarError(usernameInput, usernameError);
            hayError = true;
        }

        if (passInput === '') {
            mostrarError(passwordInput, passwordError);
            hayError = true;
        }

        if (hayError) {
            return;
        }

        // Verifica que exista un usuario con esa misma contraseña
        const validUser = usersDB.find(usuario =>
            usuario.user === userInput && usuario.pass === passInput
        );

        if (validUser) {
            errorMessage.classList.add('hidden');

            alert(`¡Bienvenido ${validUser.user}! Has ingresado como: ${validUser.role}`);

            // Más adelante podés redirigir según el rol:
            // if (validUser.role === "Administrador") {
            //     window.location.href = "admin.html";
            // } else if (validUser.role === "Encargado Sucursal") {
            //     window.location.href = "encargado.html";
            // } else if (validUser.role === "Secretaria") {
            //     window.location.href = "secretaria.html";
            // }
        } else {
            errorMessage.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
